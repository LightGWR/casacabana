<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Casa Cabana</title><link rel="stylesheet" href="assets/style.css"></head><body class="admin-locked"><div class="admin-loading">Verificando acesso administrativo...</div><main class="site-shell"><div class="content"><header class="client-top"><a class="brand" href="admin.html">Casa Cabana</a><button id="logout" class="back">Sair</button></header><section class="page-head"><p class="eyebrow">PAINEL ADMINISTRATIVO</p><h1>Gerenciar</h1><p class="lead">Atualize o conteúdo sem mexer no código.</p></section><nav class="admin-nav"><button class="side active" data-section="location">⌖<br>Localização</button><button class="side" data-section="menu">☷<br>Cardápio</button><button class="side" data-section="places">♨<br>Lugares</button></nav>
<section id="location" class="admin-section active"><h2>Localização da casa</h2><form id="location-form" class="panel form-grid"><label>Título<input id="location-title" required></label><label>Endereço<input id="location-address" required></label><label class="full">Orientações<textarea id="location-directions"></textarea></label><label class="full">Link do Google Maps<input id="location-maps" type="url"></label><label class="full">Imagem<input id="location-image" type="file" accept="image/*"></label><button class="btn full">Salvar localização</button><p class="message full" id="location-message"></p></form></section>
<section id="menu" class="admin-section"><h2>Cardápio da casa</h2><form id="menu-form" class="panel form-grid"><input id="menu-id" type="hidden"><label>Nome<input id="menu-name" required></label><label>Preço<input id="menu-price" type="number" min="0" step="0.01"></label><label class="full">Descrição<textarea id="menu-description"></textarea></label><label>Ordem<input id="menu-order" type="number" value="0"></label><label>Imagem<input id="menu-image" type="file" accept="image/*"></label><button class="btn full">Salvar item</button><p class="message full" id="menu-message"></p></form><div id="menu-admin-list" class="list"></div></section>
<section id="places" class="admin-section"><h2>Locais para comer</h2><form id="place-form" class="panel form-grid"><input id="place-id" type="hidden"><label>Nome<input id="place-name" required></label><label>Link do Google Maps<input id="place-maps" type="url" required></label><label class="full">Descrição<textarea id="place-description"></textarea></label><label>Ordem<input id="place-order" type="number" value="0"></label><label>Imagem<input id="place-image" type="file" accept="image/*"></label><button class="btn full">Salvar local</button><p class="message full" id="place-message"></p></form><div id="places-admin-list" class="list"></div></section>
<p class="bottom-note">Somente administradores autenticados conseguem visualizar e utilizar este painel.</p></div></main><script type="module" src="assets/admin.js"></script></body></html>
